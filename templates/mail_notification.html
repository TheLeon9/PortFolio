<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Discount Light</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        background-color: #f8f8ff;
        margin: 0;
        padding: 0;
        font-family: 'Nunito', sans-serif;
      }
      .container {
        max-width: 600px;
        margin: auto;
        background-color: #f8f8ff;
        padding: 30px 15px;
        box-shadow: 1px 4px 11px 0px rgba(0, 0, 0, 0.15);
      }
      .title {
        color: #0132b5;
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 28px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 3px;
        line-height: 32px;
        margin: 0;
      }
      .text-center {
        text-align: center;
        color: #1c1c1c;
        font-size: 16px;
        line-height: 24px;
        margin-top: 20px;
      }
      .info {
        color: #1c1c1c;
        font-size: 16px;
        line-height: 24px;
        margin: 15px 0;
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;400;600;800&family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <!-- Header Title -->
      <h1 class="title">MY PORTFOLIO</h1>

      <!-- Intro Text -->
      <p class="text-center">
        You received the following message from your Portfolio:
      </p>

      <!-- Information List -->
      <p class="info"><strong>Date:</strong> {{Date}}</p>
      <p class="info"><strong>Last Name:</strong> {{LastName}}</p>
      <p class="info"><strong>Email:</strong> {{Email}}</p>
      <p class="info"><strong>Phone:</strong> {{Phone}}</p>
      <p class="info"><strong>Message:</strong> {{Message}}</p>
    </div>
  </body>
</html>
